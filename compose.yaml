services:
  postgres:
    image: postgres:18
    container_name: hosting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - hosting-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.Miranda
    container_name: hosting-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Hosting__StorageRoot: ${HOST_STORAGE_ROOT}
      Hosting__DataProtectionKeys: ${HOST_DATA_PROTECTION}
    ports:
      - "5157:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_STORAGE_ROOT}:${HOST_STORAGE_ROOT}
      - ${HOST_DATA_PROTECTION}:${HOST_DATA_PROTECTION}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hosting-network

networks:
  hosting-network:
    driver: bridge

volumes:
  postgres_data: